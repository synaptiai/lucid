[project]
name = "lucid"
version = "0.1.0"
description = "First-draft interface for auditing your thinking-with-AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Daniel Bentes", email = "daniel.bentes@gmail.com" },
]
dependencies = [
    "typer==0.24.1",
    "pydantic==2.13.3",
    "anthropic==0.96.0",
    "voyageai==0.3.7",
    "orjson==3.11.8",
    "ijson==3.5.0",
    "aiosqlite==0.22.1",
    "jinja2==3.1.6",
    "rich==15.0.0",
    "tenacity==9.1.4",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "krippendorff==0.8.2",
    # irrCAC 0.4.4 was in plan v3 for Gwet's AC1 but it hard-pins
    # numpy==1.26.4 / scipy==1.12.0, which collide with voyageai==0.3.7
    # (requires numpy>=2.1.0). Gwet AC1 is a closed-form formula (~15 lines)
    # implemented by hand in lucid/calibration/validate.py. Tests validate
    # against worked examples from Gwet 2014 (Handbook of Inter-Rater
    # Reliability, 4th ed.). Dependency deviation from plan recorded in
    # docs/methodology.md §9.
    "filelock==3.29.0",
    "ollama>=0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "mypy==1.20.2",
    "ruff==0.15.11",
    "pyinstaller==6.19.0",
]

[project.scripts]
lucid = "lucid.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucid"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]
# Math / Greek letters appear in docstrings for IAA metrics (Krippendorff α,
# Gwet AC1, Cohen's κ) and numeric thresholds (≥, ≤, ², ×). Whitelisting
# them here keeps RUF001/002/003 clean without per-line noqa noise.
allowed-confusables = ["α", "κ", "π", "β", "γ", "Σ", "×", "²", "≥", "≤", "–", "—"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["lucid"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ijson", "ijson.*", "scipy", "scipy.*", "krippendorff"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Low-variance fixture corpora trip scipy's BCa degeneracy warnings.
    # Production calibration uses 200+ real labels with actual variance
    # so these warnings are a fixture artifact, not a code smell.
    "ignore::scipy.stats.DegenerateDataWarning",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning",
]
